[project]
name = "auto-tracker"
version = "0.1.0"
description = "Personal Telegram bot: car maintenance log, mileage, photos and reminders"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    # Required by aiogram's AiohttpSession for proxy support
    "aiohttp-socks==0.12.0",
    "sqlalchemy[asyncio]==2.1.4",
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    # zoneinfo data for the slim Docker image
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by Alembic
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
